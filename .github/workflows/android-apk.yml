name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_ART: ${{ secrets.ILLUSTRATIONS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Illustrations (dépôt privé, si le secret ILLUSTRATIONS_TOKEN existe)
        if: env.HAS_ART == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ILLUSTRATIONS_REPO || format('{0}/PartyGames-illustrations', github.repository_owner) }}
          token: ${{ secrets.ILLUSTRATIONS_TOKEN }}
          path: illustrations
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci || npm install
      - name: Build web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SPOTIFY_REDIRECT: ${{ secrets.VITE_SPOTIFY_REDIRECT }}
      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: timesup-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
