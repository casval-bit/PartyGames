name: Site de test (GitHub Pages)

# Publie l'appli sur https://<ton-pseudo>.github.io/<dépôt>/ pour la tester sur téléphone, avec le vrai réseau
# (images Wikipédia incluses). À activer une fois : Settings > Pages > Source : "GitHub Actions".
# Secrets facultatifs (Settings > Secrets and variables > Actions) : VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
